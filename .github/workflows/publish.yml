name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-cli:
    name: Publish create-stellar-agentic
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (no registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare package files
        run: |
          for dir in templates skills agents evals data scripts .claude .claude-plugin; do
            cp -r "$dir" packages/create-stellar-agentic/
          done
          cp SKILL.md CLAUDE.md README.md .env.example .mcp.json packages/create-stellar-agentic/

      - name: Publish to npmjs.org via OIDC
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public
        working-directory: packages/create-stellar-agentic

      - name: Publish to GitHub Packages
        run: |
          cd packages/create-stellar-agentic
          node -e "
            const p = require('fs');
            const pkg = JSON.parse(p.readFileSync('package.json','utf-8'));
            pkg.name = '@rylsherdamz-rgb/create-stellar-agentic';
            p.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
