name: Publish Skill
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Validate without publishing"
        type: boolean
        default: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm run validate
      - name: Validate skill structure
        run: |
          echo "::group::SKILL.md check"
          head -5 SKILL.md | grep -q "^name:" && echo "✓ name" || echo "✗ name"
          head -5 SKILL.md | grep -q "^version:" && echo "✓ version" || echo "✗ version"
          head -5 SKILL.md | grep -q "^description:" && echo "✓ description" || echo "✗ description"
          head -5 SKILL.md | grep -q "^tags:" && echo "✓ tags" || echo "✗ tags"
          echo "::endgroup::"
          echo "::group::marketplace.json check"
          test -f .claude-plugin/marketplace.json && echo "✓ exists" || echo "✗ missing"
          echo "::endgroup::"
          echo "::group::skill.json check"
          test -f skill.json && echo "✓ exists" || echo "✗ missing"
          echo "::endgroup::"
          echo "::group::npm package check"
          test -f packages/create-stellar-agentic/package.json && echo "✓ exists" || echo "✗ missing"
          echo "::endgroup::"

  publish-npm:
    needs: validate
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --access public
        working-directory: packages/create-stellar-agentic
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  sync-skills-sh:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify skills.sh registry
        run: |
          echo "Repository is discoverable at skills.sh via install telemetry."
          echo "Users can install with: npx skills add rylsherdamz-rgb/stellar-agentic-framework"
